  <script>
    // Hide animated nodes until GSAP takes over. If it never does (blocked
    // CDN, script error), show everything after a short grace period.
    document.documentElement.classList.add("js");
    setTimeout(function () {
      if (!window.__jingleAnim) document.documentElement.classList.remove("js");
    }, 2500);
  </script>

<body id="top">
  <div class="page">

    <!-- ========== 1. Nav ========== -->
    <header class="nav">
      <a class="nav__logo js-anim" href="#top" aria-label="jingle home">
        <img src="src/logo.svg" width="64" height="64" alt="">
      </a>
      <a class="nav__link js-anim" href="https://github.com/OPDhaker/jingle#readme">Docs</a>
      <div class="nav__end js-anim">
        <a class="nav__github" href="https://github.com/OPDhaker/jingle" aria-label="jingle on GitHub">
          <img src="src/github.svg" width="29" height="29" alt="" decoding="async">
        </a>
      </div>
    </header>

    <main>
      <!-- ========== 2. Hero ========== -->
      <section class="hero" aria-labelledby="hero-title">
        <figure class="hero__media js-anim">
          <picture>
            <source srcset="src/hero-img.webp" type="image/webp">
            <img src="src/hero-img.png" width="832" height="832" fetchpriority="high" alt="A snarling white wolf, black-and-white photo.">
          </picture>
        </figure>

        <div class="hero__content">
          <div class="hero__intro">
            <h1 id="hero-title" class="hero__title js-anim">Let the room know you shipped!</h1>
            <p class="hero__sub js-anim">A producer tag on every <code>git commit</code> and <code>git push</code>. Install it once and it works in every repo.</p>
          </div>

          <div class="hero__actions">
            <div class="codecard js-anim">
              <pre class="codecard__body"><code id="install-cmd">brew trust opdhaker/tap
brew install OPDhaker/tap/jingle
jingle install --yes</code></pre>
              <button class="codecard__copy" type="button" data-copy="#install-cmd" aria-label="Copy install commands">
                <img class="icon-copy" src="src/lucide/copy.svg" width="24" height="24" alt="" decoding="async">
                <svg class="icon-check" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M20 6 9 17l-5-5" stroke="#302F2C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>

            <div class="divider js-anim" aria-hidden="true">
              <span class="divider__rule"></span>
              <span class="divider__or">or</span>
              <span class="divider__rule"></span>
            </div>

            <div class="hero__cta js-anim">
              <a class="btn btn--ink" href="https://github.com/OPDhaker/jingle/releases/latest/download/Jingle_macos_universal.dmg">
                <span>Download</span>
                <img src="src/apple.svg" width="24" height="24" alt="" decoding="async">
                <span class="visually-hidden">the Mac app</span>
              </a>
            </div>
          </div>

          <p class="hero__note js-anim">macOS and Linux • Free and open source (MIT)</p>
        </div>
      </section>

      <!-- ========== 3. Plays on ========== -->
      <section class="plays" aria-labelledby="plays-title">
        <div class="plays__panel">
          <h2 id="plays-title" class="plays__title js-anim">Plays on</h2>
          <ul class="plays__list" role="list">
            <li class="js-anim">
              <button class="pill" type="button" data-sound="src/sounds/chime.wav" aria-label="Play the commit sound (chime)">
                <span class="pill__label">every commit</span>
                <img class="pill__icon" src="src/lucide/git-commit-horizontal.svg" width="32" height="32" alt="" decoding="async">
              </button>
            </li>
            <li class="js-anim">
              <button class="pill" type="button" data-sound="src/sounds/fanfare.wav" aria-label="Play the push sound (fanfare)">
                <span class="pill__label">every successful push</span>
                <img class="pill__icon" src="src/lucide/git-pull-request-draft.svg" width="32" height="32" alt="" decoding="async">
              </button>
            </li>
            <li class="js-anim">
              <button class="pill" type="button" data-sound="src/sounds/harmony.wav" aria-label="Play the merge sound (harmony)">
                <span class="pill__label">merge commits</span>
                <img class="pill__icon" src="src/lucide/git-merge.svg" width="32" height="32" alt="" decoding="async">
              </button>
            </li>
          </ul>
        </div>
      </section>
    </main>
  </div>

  <p class="visually-hidden" aria-live="polite" id="live"></p>
