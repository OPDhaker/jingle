name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows support is deferred (PRD.md, Phase 3), so a Windows failure is
    # reported but doesn't fail the run.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build ./cmd/jingle

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # The menu-bar app (gui/). Builds and tests it on both supported OSes;
  # packaging comes later.
  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v5
      - name: Linux webview and tray libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # typecheck + dist/, which the Rust build embeds
      - run: cargo fmt --check
        working-directory: gui/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: gui/src-tauri
      - run: cargo test
        working-directory: gui/src-tauri

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck install.sh scripts/e2e-clean-machine.sh scripts/linux-player-smoke/smoke.sh

  # Builds the release as GoReleaser would (snapshot, nothing published), then
  # installs it on a clean HOME through install.sh and checks the full
  # install → play → uninstall --purge round trip. On Linux, also runs every
  # supported audio player against null outputs.
  release-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - run: scripts/e2e-clean-machine.sh dist
      - name: Linux player smoke test
        if: runner.os == 'Linux'
        run: |
          docker build -t jingle-smoke scripts/linux-player-smoke
          docker run --rm \
            -v "$PWD/scripts/linux-player-smoke:/smoke:ro" \
            -v "$PWD/$(find dist -path '*linux_amd64*' -name jingle -type f):/jingle:ro" \
            jingle-smoke
