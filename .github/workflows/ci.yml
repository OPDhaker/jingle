name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows support is deferred (PRD.md, Phase 3), so a Windows failure is
    # reported but doesn't fail the run.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build ./cmd/jingle

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck install.sh scripts/e2e-clean-machine.sh scripts/linux-player-smoke/smoke.sh

  # Builds the release as GoReleaser would (snapshot, nothing published), then
  # installs it on a clean HOME through install.sh and checks the full
  # install → play → uninstall --purge round trip. On Linux, also runs every
  # supported audio player against null outputs.
  release-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - run: scripts/e2e-clean-machine.sh dist
      - name: Linux player smoke test
        if: runner.os == 'Linux'
        run: |
          docker build -t jingle-smoke scripts/linux-player-smoke
          docker run --rm \
            -v "$PWD/scripts/linux-player-smoke:/smoke:ro" \
            -v "$PWD/$(find dist -path '*linux_amd64*' -name jingle -type f):/jingle:ro" \
            jingle-smoke
